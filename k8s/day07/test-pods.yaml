# 세 파드를 나란히 띄워 비교합니다.
#   1) SA 없음        → 자격증명 없음 (NoCredentials)
#   2) IRSA SA        → irsa-demo-role 로 동작
#   3) Pod Identity SA → podid-demo-role 로 동작
#
# 각 파드는 자기가 누구인지 출력하고, s3:ListAllMyBuckets 를 시도합니다.
# (노드 역할에는 없는 권한이라 IRSA/PodIdentity 덕분인지 구분됩니다)
---
apiVersion: v1
kind: Pod
metadata:
  name: awsid-none
  namespace: demo
spec:
  restartPolicy: Never
  containers:
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sh", "-c"]
      args:
        - |
          echo "=== SA 없음 ==="
          aws sts get-caller-identity 2>&1 | head -3
          echo "--- s3 ls ---"
          aws s3 ls 2>&1 | head -2
---
apiVersion: v1
kind: Pod
metadata:
  name: awsid-irsa
  namespace: demo
spec:
  restartPolicy: Never
  serviceAccountName: irsa-demo
  containers:
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sh", "-c"]
      args:
        - |
          echo "=== IRSA ==="
          aws sts get-caller-identity --query Arn --output text 2>&1 | head -2
          echo "--- 주입된 환경변수 ---"
          env | grep -E 'AWS_ROLE_ARN|AWS_WEB_IDENTITY_TOKEN_FILE|AWS_STS_REGIONAL'
          echo "--- s3 ls ---"
          aws s3 ls 2>&1 | head -3
---
apiVersion: v1
kind: Pod
metadata:
  name: awsid-podid
  namespace: demo
spec:
  restartPolicy: Never
  serviceAccountName: podid-demo
  containers:
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sh", "-c"]
      args:
        - |
          echo "=== Pod Identity ==="
          aws sts get-caller-identity --query Arn --output text 2>&1 | head -2
          echo "--- 주입된 환경변수 (IRSA와 다름) ---"
          env | grep -E 'AWS_CONTAINER_CREDENTIALS|AWS_CONTAINER_AUTHORIZATION'
          echo "--- s3 ls ---"
          aws s3 ls 2>&1 | head -3
