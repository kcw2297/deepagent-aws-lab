# ── 방법 A: IRSA ──
# 역할 ARN을 애노테이션으로 지정합니다.
# 이 애노테이션을 본 EKS의 웹훅이 파드에 다음을 주입합니다:
#   · 환경변수 AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE
#   · projected ServiceAccount 토큰을 담은 볼륨
# AWS SDK가 그 둘을 보고 스스로 sts:AssumeRoleWithWebIdentity를 호출합니다.
#
# ⚠️ ARN의 계정 ID와 역할 이름이 맞아야 합니다.
#    terraform -chdir=terraform output -raw irsa_demo_role_arn 로 확인하세요.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-demo
  namespace: demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::590184068466:role/deepagent-eks-lab-irsa-demo-role
