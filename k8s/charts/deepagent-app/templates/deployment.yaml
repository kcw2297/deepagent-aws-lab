apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepagent-app.fullname" . }}
  labels: {{- include "deepagent-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "deepagent-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "deepagent-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.topologySpreadEnabled }}
      # 파드를 AZ별로 고루 배치. maxSkew=1 이면 AZ 간 개수 차이가 1을 넘지 않습니다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "deepagent-app.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            # downward API — 파드가 자기가 뜬 노드와 자기 IP를 알 수 있게 합니다.
            # 응답에 실어 보내서 스케줄링/네트워킹을 눈으로 확인하려는 목적입니다.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
