# ── StorageClass: gp3 (EBS CSI) ──
#
# [왜 새로 만드나]
# EKS가 클러스터 생성 시 만들어두는 gp2 StorageClass는
#   provisioner: kubernetes.io/aws-ebs     ← in-tree(쿠버네티스 내장) 방식
# 입니다. 이 in-tree 드라이버는 쿠버네티스에서 제거되고 CSI로 이전됐습니다.
# 게다가 provisioner 필드는 immutable이라 고칠 수 없습니다:
#   kubectl patch storageclass gp2 ... → "field is immutable"
# 그래서 CSI 방식으로 새로 만들고 이걸 기본값으로 지정합니다.
# (gp2는 EKS가 만든 것이라 그대로 둡니다. 기본값이 아니므로 쓰이지 않습니다)
#
# [provisioner는 "이름표"일 뿐입니다]
# ebs.csi.aws.com 은 드라이버가 자기 자신을 등록할 때 쓰는 이름이고,
# 이 필드를 적는다고 드라이버가 설치되지는 않습니다.
# EBS CSI 드라이버(애드온)를 따로 설치해야 이 StorageClass가 동작합니다.
# Day 8의 GatewayClass.controllerName 과 같은 구조입니다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    # PVC가 storageClassName을 안 쓰면 이게 자동으로 선택됩니다.
    # 현재 클러스터에는 기본 StorageClass가 없었습니다.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  # gp3 vs gp2: gp3가 더 저렴하고, IOPS가 크기와 무관하게 기본 3000입니다.
  # gp2는 IOPS가 볼륨 크기에 비례해서 작은 볼륨은 느립니다.
  type: gp3
  fsType: ext4
  # 저장 데이터 암호화. 끌 이유가 없습니다.
  encrypted: "true"
# EBS는 AZ에 묶이므로 파드가 어느 AZ에 뜰지 정해진 다음에 볼륨을 만듭니다.
volumeBindingMode: WaitForFirstConsumer
# PVC를 지우면 EBS 볼륨도 삭제됩니다.
# Retain이면 PVC를 지워도 볼륨이 남아 계속 과금됩니다 (고아 볼륨).
reclaimPolicy: Delete
# PVC의 용량을 나중에 늘릴 수 있게 합니다 (줄이기는 불가).
allowVolumeExpansion: true
